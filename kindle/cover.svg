<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Library cover for Bóveda: a vault door holding a graph of linked notes.
       Rendered to cover.png (see README); deploy.sh embeds it in the launcher. -->
  <rect width="600" height="900" fill="#000"/>
  <g fill="#fff">
    <rect x="76" y="262" width="26" height="46" rx="4"/>
    <rect x="76" y="352" width="26" height="46" rx="4"/>
  </g>
  <circle cx="300" cy="330" r="200" fill="none" stroke="#fff" stroke-width="16"/>
  <circle cx="300" cy="330" r="158" fill="none" stroke="#fff" stroke-width="4"/>
  <g fill="#fff">
    <circle cx="300" cy="151" r="7"/><circle cx="427" cy="203" r="7"/><circle cx="479" cy="330" r="7"/>
    <circle cx="427" cy="457" r="7"/><circle cx="300" cy="509" r="7"/><circle cx="173" cy="457" r="7"/>
    <circle cx="121" cy="330" r="7"/><circle cx="173" cy="203" r="7"/>
  </g>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="330" x2="222" y2="268"/><line x1="300" y1="330" x2="386" y2="278"/>
    <line x1="300" y1="330" x2="352" y2="414"/><line x1="300" y1="330" x2="236" y2="404"/>
    <line x1="222" y1="268" x2="302" y2="226"/><line x1="386" y1="278" x2="302" y2="226"/>
    <line x1="386" y1="278" x2="412" y2="356"/><line x1="352" y1="414" x2="412" y2="356"/>
    <line x1="236" y1="404" x2="196" y2="338"/><line x1="222" y1="268" x2="196" y2="338"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="5">
    <circle cx="300" cy="330" r="26"/>
    <circle cx="222" cy="268" r="16"/><circle cx="386" cy="278" r="18"/>
    <circle cx="352" cy="414" r="16"/><circle cx="236" cy="404" r="14"/>
    <circle cx="302" cy="226" r="11"/><circle cx="412" cy="356" r="11"/><circle cx="196" cy="338" r="11"/>
  </g>
  <text x="300" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="112" fill="#fff" text-anchor="middle">Bóveda</text>
  <rect x="250" y="728" width="100" height="6" fill="#fff"/>
  <text x="300" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#fff" text-anchor="middle">Mis notas de Obsidian</text>
</svg>
