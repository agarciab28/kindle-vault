<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- The system title bar (back / title / close) is configured from app.js. -->
<!-- The menu is drawn by app.js in the interface language. -->
<div id="menu"></div>
<div id="content"><p class="muted">…</p></div>
<div id="pager">
  <a href="javascript:app.page(-1)">▲</a>
  <a href="javascript:app.page(1)">▼</a>
</div>
<!-- token.js is written by vaultd at start (random API token); never commit it. -->
<script src="token.js"></script>
<script src="app.js"></script>
</body>
</html>
