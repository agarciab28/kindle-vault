# Tests and builds Vault on every push; a tag "v…" also publishes the release.
# The release zip is built here, from the tagged source, so anyone can check
# where the binaries come from.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags, for the version in the package
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vaultd/go.mod
          cache-dependency-path: vaultd/go.sum
      - name: Sync client (pinned upstream commit + patch; runs the read-only tests)
        run: client/build.sh
      - name: vaultd tests and package
        run: ./package.sh
      - name: Checksum
        run: cat build/vault.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vault
          path: |
            build/vault.zip
            build/vault.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vault
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            printf '\n## Checksum\n\n```\n'
            cat dist/vault.zip.sha256
            printf '```\n\nBuilt by GitHub Actions from this tag: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/vault.zip dist/vault.zip.sha256 \
            --title "Vault ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
